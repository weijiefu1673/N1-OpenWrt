name: Build Immortalwrt-25.12 for N1

on:
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        preinstalled-runtimes: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
        
    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh | sudo bash > /dev/null
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        chmod +x $GITHUB_WORKSPACE/diy-part1.sh
        $GITHUB_WORKSPACE/diy-part1.sh
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        chmod +x $GITHUB_WORKSPACE/diy-part2.sh
        $GITHUB_WORKSPACE/diy-part2.sh

    - name: Load N1 custom config
      working-directory: ./openwrt
      run: |
        rm -rf ./files ./.config
#        mv "$GITHUB_WORKSPACE/files" ./files
        mv "$GITHUB_WORKSPACE/config.seed" ./.config

    - name: Download package
      working-directory: ./openwrt
      run: |
        make defconfig
        make download -j$(( $(nproc) * 2 ))
        find dl -size -1k -exec ls -l {} \;
        find dl -size -1k -exec rm -f {} \;

    - name: Compile N1 firmware
      working-directory: ./openwrt
      run: |
        echo -e "可使用的核心数：$(nproc)"
        make -j$(nproc) || make -j$(($(nproc) / 2)) || make -j1 V=s

    - name: Package N1 firmware
      uses: ophub/amlogic-s9xxx-openwrt@main
      with:
        openwrt_path: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
        openwrt_board: s905d
        kernel_repo: ophub/kernel
        kernel_usage: flippy
        openwrt_kernel: 6.12.y
        builder_name: weijiefu1673

    - name: Upload firmware
      uses: actions/upload-artifact@main
      if: env.UPLOAD_FIRMWARE == 'true'
      with:
        name: ImmortalWrt_${{ env.PACKAGED_OUTPUTDATE }}
        path: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
        
    - name: Release Firmware
      uses: softprops/action-gh-release@master
      if: env.UPLOAD_RELEASE == 'true'
      with:
        tag_name: ImmortalWrt_${{ env.PACKAGED_OUTPUTDATE }}
        files: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
        body: |
          首次使用建议全新刷写
          * 基本信息
          IP: 192.168.1.5
          账户: root
          密码: password
          